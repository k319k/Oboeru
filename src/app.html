<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="おぼえる — 音声で文章を練習するアプリ。表示された文を読み上げ、録音した音声を文字起こしして類似度を採点します。"
		/>
		<meta name="theme-color" content="#2563eb" />
		<script>
			// Apply the saved/system theme before hydration to prevent a flash of
			// unstyled content (FOUC). Mirrors src/lib/theme.ts (key: oboeru:theme).
			(function () {
				var stored = null;
				try {
					stored = localStorage.getItem('oboeru:theme');
				} catch (e) {
					stored = null;
				}
				var dark =
					stored === 'dark' ||
					(stored !== 'light' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
